[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oath-relay"
dynamic = ["version"]
description = "Share a stateful HOTP token across devices from one counter"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Peng Ding" }]
keywords = ["hotp", "totp", "otp", "2fa", "oath", "duo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build"]

[project.scripts]
oath-relay = "oath_relay.cli:main"

[project.urls]
Homepage = "https://github.com/Oaklight/oath-relay"
Issues = "https://github.com/Oaklight/oath-relay/issues"

[tool.setuptools.dynamic]
version = { attr = "oath_relay.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.zerodep]
vendor-dir = "src/oath_relay/_vendor"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["src/oath_relay/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
